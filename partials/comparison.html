<div class="container comparison">
  <div class="section-head">
    <p class="section-head__en">COMPARISON</p>
    <p class="section-head__ja">使用前後の比較</p>
  </div>
  <p class="comparison__lead">わずか5分のスタイリングで、<br class="sp-break">サロン帰りのような仕上がりに</p>
  <div class="comparison__images">
    <div class="comparison__image-item">
      <div class="comparison__image-card">
        <img src="assets/img/comparison-before.png" alt="使用前の髪" loading="lazy" width="624" height="468">
        <span class="comparison__badge comparison__badge--before">Before</span>
      </div>
      <img class="comparison__closeup comparison__closeup--before" src="assets/img/comparison-before-closeup.png" alt="熱ダメージでキューティクルが開き、水分が逃げやすい状態" loading="lazy" width="232" height="191">
    </div>
    <img class="comparison__arrow" src="assets/img/comparison-arrow.svg" alt="" aria-hidden="true">
    <div class="comparison__image-item">
      <div class="comparison__image-card">
        <img src="assets/img/comparison-after.png" alt="使用後の髪" loading="lazy" width="624" height="468">
        <span class="comparison__badge comparison__badge--after">After</span>
      </div>
      <img class="comparison__closeup comparison__closeup--after" src="assets/img/comparison-after-closeup.png" alt="キューティクルが整い、うるおいを閉じ込めてツヤのある髪へ" loading="lazy" width="215" height="178">
    </div>
  </div>
  <div class="comparison__points">
    <ol class="comparison__point-list">
      <li class="comparison__point">
        <p class="comparison__point-title"><span>1</span>. 少ない回数で<br class="sp-break">　思い通りのストレート</p>
        <p class="comparison__point-desc">湿度の高い日でもスタイリングをキープ</p>
      </li>
      <li class="comparison__point">
        <p class="comparison__point-title"><span>2</span>. マイナスイオンで<br class="sp-break">　ケア＆スタイリング</p>
        <p class="comparison__point-desc">髪内部の水分量が約121%にUP</p>
      </li>
    </ol>
    <img src="assets/img/comparison-chart.png" alt="他社製品との使用回数比較チャート" class="comparison__chart" loading="lazy" width="457" height="249">
  </div>
</div>
