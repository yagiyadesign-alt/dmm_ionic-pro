<div class="container faq">
  <div class="section-head">
    <p class="section-head__en">FAQ</p>
    <p class="section-head__ja">よくあるご質問</p>
  </div>
  <ul class="faq__list">
    <li class="faq__item">
      <button class="faq__question" aria-expanded="false">
        <span>毎日使っても傷まないですか？</span>
        <span class="faq__icon">+</span>
      </button>
      <p class="faq__answer">低温設定でも使用できるため、毎日のご使用でも髪への負担を抑えられます。マイナスイオン機能が髪の水分保持をサポートします。</p>
    </li>
    <li class="faq__item">
      <button class="faq__question" aria-expanded="false">
        <span>ヘアオイル併用OKですか？</span>
        <span class="faq__icon">+</span>
      </button>
      <p class="faq__answer">はい、ご使用いただけます。スタイリング前にヘアオイルをなじませることで、より美しい仕上がりになります。</p>
    </li>
    <li class="faq__item">
      <button class="faq__question" aria-expanded="false">
        <span>初心者でも使いやすいですか？</span>
        <span class="faq__icon">+</span>
      </button>
      <p class="faq__answer">5段階の温度調節とデジタル表示で、初めての方でも簡単に操作いただけます。</p>
    </li>
    <li class="faq__item">
      <button class="faq__question" aria-expanded="false">
        <span>海外でも使用できますか？</span>
        <span class="faq__icon">+</span>
      </button>
      <p class="faq__answer">海外対応の電圧仕様となっておりますので、変圧器なしでご使用いただけます（一部地域を除く）。</p>
    </li>
    <li class="faq__item">
      <button class="faq__question" aria-expanded="false">
        <span>保証期間はどのくらいですか？</span>
        <span class="faq__icon">+</span>
      </button>
      <p class="faq__answer">ご購入日より1年間のメーカー保証がついております。</p>
    </li>
  </ul>
</div>
